<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منوی کافه گیم آرنا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style id="base">
:root{--bg:#160e0a;--bg2:#21150e;--card:#2a1b12;--cream:#ecd5a3;--gold:#d9a95b;--text:#f3e6c8;--mute:#a8927a;--line:#4a3424;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:70px;height:100%}
*{box-sizing:border-box;margin:0}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100%;
background-image:radial-gradient(circle at 1px 1px,rgba(236,213,163,.07) 1px,transparent 0);background-size:22px 22px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

/* welcome */
#welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 24px;text-align:center;
background:radial-gradient(ellipse at 50% 30%,#3a2415 0%,transparent 60%)}
.logo{position:relative;width:min(62vw,250px);aspect-ratio:1}
.logo img{width:100%;height:100%;border-radius:50%;display:block;box-shadow:0 0 0 3px var(--gold),0 0 0 9px var(--bg),0 0 0 11px rgba(217,169,91,.5),0 0 60px rgba(217,169,91,.35)}
.logo::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(217,169,91,.4);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#welcome h1{font-size:clamp(1.6rem,6.5vw,2.4rem);font-weight:800;color:var(--cream);line-height:1.5;margin-top:10px}
#welcome p{color:var(--mute);font-size:.95rem}
.enter{display:inline-flex;align-items:center;gap:12px;background:var(--cream);color:#2a1a0e;border:0;border-radius:14px;padding:15px 34px;font-weight:800;font-size:1.1rem;
box-shadow:0 5px 0 #a47d3c,0 12px 30px rgba(0,0,0,.45);transition:transform .12s,box-shadow .12s;margin-top:8px}
.enter:active{transform:translateY(4px);box-shadow:0 1px 0 #a47d3c,0 6px 14px rgba(0,0,0,.4)}
.pad{display:inline-block;width:22px;height:22px;position:relative}
.pad::before,.pad::after{content:"";position:absolute;background:#2a1a0e;border-radius:2px}
.pad::before{left:8px;top:0;width:6px;height:22px}.pad::after{top:8px;left:0;width:22px;height:6px}

/* menu */
header.top{position:sticky;top:0;z-index:5;background:rgba(22,14,10,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px}
.bar img{width:38px;height:38px;border-radius:50%}
.bar b{color:var(--cream);font-weight:800}
.bar button{margin-inline-start:auto;background:none;border:1px solid var(--line);color:var(--mute);border-radius:10px;padding:5px 12px;font-size:.8rem}
nav{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:var(--mute);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:.88rem;white-space:nowrap}
nav a.on{background:var(--gold);color:#241508;border-color:var(--gold);font-weight:600}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
section{margin-bottom:30px}
section h2{display:flex;align-items:center;gap:12px;font-size:1.25rem;color:var(--cream);font-weight:800;margin-bottom:12px}
section h2::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px);opacity:.45}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px}
.item{display:flex;align-items:baseline;gap:8px;padding:11px 0}
.item+.item{border-top:1px solid rgba(74,52,36,.5)}
.item span{font-size:1rem}
.item i{flex:1;border-bottom:2px dotted rgba(168,146,122,.4);transform:translateY(-3px);min-width:12px}
.item em{white-space:nowrap;font-style:normal;font-weight:800;color:var(--gold);font-size:1.02rem}
.item em small{font-weight:400;color:var(--mute);font-size:.72rem;margin-inline-start:5px}
.note{text-align:center;color:var(--mute);font-size:.8rem;margin-top:10px}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:10px 16px 30px}
@media(prefers-reduced-motion:reduce){.logo::after{animation:none}.enter{transition:none}}

.item.off span{color:var(--mute);text-decoration:line-through}
.item.off em{color:#d9826f;font-size:.85rem}
#adm{margin-inline-start:0}
#ovl{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto}
.ovh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--bg2);border-bottom:1px solid var(--line)}
.ovh b{flex:1;color:var(--cream)}
.ovh small{color:var(--mute);font-size:.75rem}
.btn{background:var(--gold);color:#241508;border:0;border-radius:10px;padding:8px 16px;font-weight:800}
.btn.g{background:none;color:var(--gold);border:1px solid var(--line);font-weight:600}
#ovbody{max-width:640px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px}
.cat h3{color:var(--cream);margin-bottom:10px;font-size:1.05rem}
.row{display:grid;grid-template-columns:1fr 80px auto auto;gap:6px;align-items:center;margin-bottom:8px}
.row.add{grid-template-columns:1fr 80px auto;padding-top:8px;border-top:1px dashed var(--line)}
.row input[type=text]{width:100%;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:.92rem}
.row label{display:flex;align-items:center;gap:4px;font-size:.76rem;color:var(--mute);white-space:nowrap}
.row .x{background:none;border:0;color:#e07a6a;font-size:1.1rem;padding:4px 6px}

.lnk{background:none;border:0;color:var(--mute);font-size:.78rem;text-decoration:underline;margin-top:8px;opacity:.7}
#lg{position:fixed;inset:0;z-index:30;background:rgba(10,6,4,.88);display:flex;align-items:center;justify-content:center;padding:20px}
.lgb{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:100%;max-width:340px;display:grid;gap:10px}
.lgb b{color:var(--cream);font-size:1.1rem}
.lgb input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;direction:ltr;text-align:right}
#le{color:#e07a6a;font-size:.82rem;min-height:1em}

.item{align-items:center;gap:10px}
.item .ph{flex:none;width:46px;height:46px;border-radius:50%;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.item .ph svg{width:28px;height:28px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item.off .ph{opacity:.45}
.item i{transform:none}
</style>
</head>

function kind(n){
  if(/آیس|لیموناد|موهیتو/.test(n))return"glass";
  if(/چای|دمنوش/.test(n))return"tea";
  if(/اسپرسو|ترک/.test(n))return"espresso";
  if(/آمریکانو|کاپوچینو|چاکلت|لته|موکا|نسکافه/.test(n))return"mug";
  if(/کیک|کوکی/.test(n))return"cake";
  if(/پیتزا/.test(n))return"pizza";
  return"plate"}
function thumb(x){
  var s=el("span","ph");
  if(x[3]){var im=el("img");im.src=x[3];im.alt="";im.loading="lazy";im.onerror=function(){s.innerHTML='<svg viewBox="0 0 48 48">'+IC[kind(x[0])]+'</svg>';};s.appendChild(im)}
  else s.innerHTML='<svg viewBox="0 0 48 48">'+IC[kind(x[0])]+'</svg>';
  return s}
function render(){
  tabs.innerHTML="";box.innerHTML="";if(io)io.disconnect();
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){
    tabs.querySelectorAll("a").forEach(function(a){var on=a.dataset.id===e.target.id;a.classList.toggle("on",on);
    if(on)a.scrollIntoView({inline:"center",block:"nearest"})})}})},{rootMargin:"-30% 0px -60% 0px"});
  DATA.forEach(function(c){
    var a=el("a",null,c.t);a.href="#"+c.id;a.dataset.id=c.id;
    a.onclick=function(e){e.preventDefault();document.getElementById(c.id).scrollIntoView({behavior:"smooth"})};
    tabs.appendChild(a);
    var s=el("section");s.id=c.id;s.appendChild(el("h2",null,c.t));
    var l=el("div","list");
    c.i.forEach(function(x){
      var d=el("div","item"+(x[2]?" off":""));
      d.appendChild(thumb(x));d.appendChild(el("span",null,x[0]));d.appendChild(el("i"));
      var p=el("em");
      if(x[2])p.textContent="ناموجود";
      else if(x[1]==null)p.textContent="—";
      else{p.textContent=fa(x[1]);p.appendChild(el("small",null,"هزار تومان"))}
      d.appendChild(p);l.appendChild(d)});
    s.appendChild(l);box.appendChild(s);io.observe(s)});
}

async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
async function login(){
  var ok=false;try{ok=(await sha(lu.value.trim()+":"+lp.value))===HASH}catch(e){}
  if(!ok){le.textContent="نام کاربری یا رمز عبور اشتباه است";lp.value="";return}
  lg.hidden=true;lu.value="";lp.value="";le.textContent="";openPanel()}

function num(v){v=String(v).replace(/[۰-۹]/g,function(d){return d.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[^0-9]/g,"");return v===""?null:parseInt(v,10)}
function inp(v,ph,mode){var i=el("input");i.type="text";i.value=v==null?"":v;i.placeholder=ph;if(mode)i.inputMode=mode;return i}

  var tb=el("div","cat");tb.appendChild(el("h3",null,"اتصال به GitHub"));
  var tk=inp(tok(),"توکن GitHub");tk.id="tk";tk.type="password";tb.appendChild(tk);

      r.append(n,p,lb,del);b.appendChild(r)});

    ab.onclick=function(){if(!nn.value.trim())return;c.i.push([nn.value.trim(),num(np.value),false]);form()};
    ra.append(nn,np,ab);b.appendChild(ra);ovb.appendChild(b)});

function fmt(d){return "[\n"+d.map(function(c){return '  {\n    "id": '+JSON.stringify(c.id)+',\n    "t": '+JSON.stringify(c.t)+',\n    "i": [\n'+c.i.map(function(x){var r=[x[0],x[1]==null?null:x[1],!!x[2]];if(x[3])r.push(x[3]);return "      "+JSON.stringify(r)}).join(",\n")+'\n    ]\n  }'}).join(",\n")+"\n]\n"}
document.getElementById("save").onclick=async function(){
  var t=((document.getElementById("tk")||{}).value||"").trim();
  if(!t){st.textContent="توکن GitHub را وارد کنید";return}
  draft.forEach(function(c){c.i=c.i.filter(function(x){return String(x[0]).trim()})});
  st.textContent="در حال ذخیره…";
  var api="https://api.github.com/repos/"+REPO+"/contents/menu.json",H={"Authorization":"Bearer "+t,"Accept":"application/vnd.github+json"};
  try{
    var r=await fetch(api+"?ref=main",{headers:H,cache:"no-store"});
    if(r.status===401||r.status===403){st.textContent="توکن نامعتبر است";return}
    var body={message:"Update menu",branch:"main",content:btoa(unescape(encodeURIComponent(fmt(draft))))};
    if(r.ok)body.sha=(await r.json()).sha;
    var w=await fetch(api,{method:"PUT",headers:H,body:JSON.stringify(body)});
    if(!w.ok){st.textContent="ذخیره نشد ("+w.status+")";return}
    try{localStorage.setItem("gh",t)}catch(e){}
    DATA=draft;render();st.textContent="ذخیره شد؛ تا ۲ دقیقه دیگر روی سایت اعمال می‌شود";
  }catch(e){st.textContent="خطای اتصال؛ دوباره تلاش کنید"}
};
